name: Android CI and dev release
on:
  push:
    branches: [mobile-main]
    paths: ["android/**", "mobile/**", "src/**", "CMakeLists.txt", "cmake/**", ".github/workflows/android-ci.yml"]
  pull_request:
    branches: [mobile-main]
    paths: ["android/**", "mobile/**", "src/**", "CMakeLists.txt", "cmake/**", ".github/workflows/android-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"
      - name: Generate Gradle Wrapper JAR
        shell: bash
        run: |
          set -euo pipefail
          wrapper_dir=$(mktemp -d)
          trap 'rm -rf "$wrapper_dir"' EXIT
          touch "$wrapper_dir/settings.gradle" "$wrapper_dir/build.gradle"
          gradle --no-daemon -p "$wrapper_dir" wrapper --gradle-version 8.14.4 --distribution-type bin --no-validate-url
          cp "$wrapper_dir/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
      - uses: gradle/actions/wrapper-validation@v4
      - name: Native host test
        run: cmake -S mobile -B build/mobile -DDT_MOBILE_BUILD_TESTS=ON && cmake --build build/mobile && ctest --test-dir build/mobile --output-on-failure
      - name: Lint, unit tests, and dev release
        working-directory: android
        run: ./gradlew --no-daemon lintDevRelease testDevReleaseUnitTest assembleDevRelease
      - name: Verify APK and checksum
        run: |
          APK=$(find android/app/build/outputs/apk/dev/release -name '*.apk' -print -quit)
          test -n "$APK"
          aapt2 dump badging "$APK" | tee android/app/build/outputs/apk/dev/release/manifest.txt
          aapt2 dump badging "$APK" | grep "package: name='org.example.darktableandroid.dev'"
          sha256sum "$APK" > "$APK.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dev-release-${{ github.sha }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/dev/release/*.apk*
            android/app/build/outputs/apk/dev/release/manifest.txt
            android/app/build/outputs/mapping/devRelease/**
            android/app/build/outputs/native-debug-symbols/devRelease/**
            android/app/build/reports/**
            android/app/build/test-results/**
            build/mobile/Testing/**
